<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Clock</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #time { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="min-h-screen m-0 flex items-center justify-center bg-gray-100 dark:bg-neutral-900 font-sans">
  <div class="bg-white dark:bg-neutral-800 rounded-2xl px-10 py-8 sm:px-14 sm:py-10 text-center shadow-xl">
    <h1 id="time" class="text-5xl sm:text-6xl font-bold text-indigo-600 dark:text-indigo-400 tracking-wide">
      00:00:00
    </h1>
    <p id="date" class="mt-3 text-gray-500 dark:text-gray-400 text-sm sm:text-base"></p>
  </div>

<script>
  function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours === 0 ? 12 : hours;
    const hoursStr = String(hours).padStart(2, "0");

    document.getElementById("time").textContent =
      `${hoursStr}:${minutes}:${seconds} ${ampm}`;

    const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    document.getElementById("date").textContent = now.toLocaleDateString(undefined, options);
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
